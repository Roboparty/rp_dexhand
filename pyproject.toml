[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-tactile-lab"
version = "0.1.0"
description = "Reproducible synthetic tactile pathway and adaptive receiver experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tactile-lab = "tactile_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
