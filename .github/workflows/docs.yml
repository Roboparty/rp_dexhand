name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check validator regressions
        run: python -m unittest discover -s tests -v
      - name: Check links, examples and resource records
        run: python tools/check_docs.py
